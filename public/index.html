  let rest=rooms.filter(r=>r.type==='fight').sort(()=>Math.random()-.5);rest[0].type='shop';rest[1].type='quiz';
  for(let r of rooms){r.doors={};for(let k in DIRS){let nb=at(r.gx+DIRS[k][0],r.gy+DIRS[k][1]);if(nb)r.doors[k]=nb}
    r.obst=[];r.props=[];r.wave=0;r.waves=r.type==='fight'?3:1;r.cleared=r.type!=='fight'&&r.type!=='boss';
    if(r.type==='fight')SLOTS.slice().sort(()=>Math.random()-.5).slice(0,3+Math.floor(Math.random()*2)).forEach(s=>r.obst.push({x:s[0],y:s[1]}));

}
function enterRoom(R,from){let g=game,p=g.player;g.room=R;R.visited=1;g.bullets=[];g.enemies=[];g.props=R.props;g.shopBought={};

function spawnEnemy(type,x,y){let d=EN[type],hp=Math.round(d.hp*(1+.22*(game.stage-1)))+game.stage+(game.allies?Object.keys(game.allies).length*2:0);game.enemies.push({type,custom:CUSTOM.includes(type),id:++EID,x,y,r:d.r,hp,max:hp,speed:d.sp,t:rand(0,6),flash:0,spawn:.7,shoot:rand(1,2),state:0,st:0,face:1,angle:0,n:0})}

  let pool=POOLS[g.stage-1],count=2+g.stage+R.wave+(g.allies?Object.keys(g.allies).length:0);
  for(let i=0;i<count;i++){let x,y,k=0;do{x=rand(120,840);y=rand(120,420);k++}while(k<30&&(dist({x,y},g.player)<170||inCrate(x,y,26)));spawnEnemy(pool[Math.floor(Math.random()*pool.length)],x,y)}}
function enemyHit(e,dmg){if(e.spawn>0)return;e.hp-=dmg;pushText(e.x,e.y-e.r,Math.round(dmg*10)/10,'#fff1c4');e.flash=.1;addParticle(e.x,e.y,e.boss?'#ff6bba':'#9ce5ad',5);beep(e.boss?160:270,.025,'square',.014);
  if(e.hp<=0){let i=game.enemies.indexOf(e);if(i>=0)game.enemies.splice(i,1);game.kills++;dropLoot(e);if(e.type==='slime')for(let s=-1;s<2;s+=2)spawnEnemy('mini',e.x+s*16,e.y);addParticle(e.x,e.y,'#f8c767',e.boss?40:18);beep(550,.18,'triangle',.06)}}

  if(R.type==='boss')R.props.push({type:'portal',x:480,y:270});else if(R.elite||Math.random()<.65)R.props.push({type:'chest',x:480,y:270})}
const eb=(e,a,s,c,r=5)=>game.bullets.push({x:e.x,y:e.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,damage:1,enemy:true,color:c,r,life:3.2});
const ring=(e,n,s,c,off=0)=>{for(let i=0;i<n;i++)eb(e,off+i/n*6.283,s,c,6)};
function enemyAttack(e){let g=game,p=g.player,a=Math.atan2(p.y-e.y,p.x-e.x);
  if(e.boss){let two=e.hp<e.max*.5;e.phase=two?2:1;let sp=two?230:175,k=e.n++%3;
    if(e.type==='scope'){if(k===0)for(let i=-3;i<=3;i++)eb(e,a+i*.17,sp,'#ff5d85',6);else if(k===1)ring(e,two?16:11,sp-30,'#ffb04d',e.angle+=.3);else if(g.enemies.length<6){spawnEnemy('bug',e.x-60,e.y+50);spawnEnemy('urgent',e.x+60,e.y+50)}else ring(e,10,sp,'#ff5d85')}
    else{if(k===0){for(let j=0;j<3;j++)ring(e,12,sp-20-j*25,'#a58bff',e.angle+=.4)}else if(k===1)for(let i=-1;i<=1;i++)eb(e,a+i*.14,sp+60,'#fd6b65',7);else{e.state=1;e.st=.6;e.dirx=Math.cos(a);e.diry=Math.sin(a)}}
    e.shoot=two?.95:1.5;beep(140,.1,'sawtooth',.04)}
  else if(e.type==='mail'){for(let i=-1;i<=1;i++)eb(e,a+i*.22,190,'#ef76ad');e.shoot=2.2/g.buff}
  else if(e.type==='meet'){ring(e,8,150,'#c59bff',e.angle+=.4);e.shoot=2.6/g.buff}}
function aimAt(){let g=game,p=g.player;if(input.aim)return input.aim;if(input.mouse.moved&&(!touchCapable||input.mouse.down))return input.mouse;
  let n=g.enemies.filter(e=>e.spawn<=0).sort((a,b)=>dist(p,a)-dist(p,b))[0];return n||{x:p.x+p.face*100,y:p.y}}

const WEAPONS=[
 {id:'scrum',rate:.36,damage:1.3,speed:540,cost:3,color:'#5ce7fd',n:3,spread:.15},
 {id:'kanban',rate:.2,damage:2.3,speed:640,cost:2,color:'#9deb7b',n:1,spread:.02,pierce:2},
 {id:'waterfall',rate:.85,damage:7,speed:360,cost:8,color:'#f5c268',n:1,spread:0,aoe:62,big:1},
 {id:'lean',rate:.22,damage:1.5,speed:470,cost:1,color:'#cf9bff',n:1,spread:.07,home:1}];
function changeWeapon(n){let g=game;if(!g||g.mode!=='play')return;let dir=n>g.weapon?1:-1;for(let i=1;i<=4;i++){let k=(g.weapon+dir*i+8)%4;if(g.owned[k]){g.weapon=k;break}}beep(490,.06);toast(T().weapons[WEAPONS[g.weapon].id])}
function unlockWeapon(){let g=game,l=[0,1,2,3].filter(i=>!g.owned[i]);if(!l.length)return;let k=l[Math.floor(Math.random()*l.length)];g.owned[k]=1;g.weapon=k}
function pickReward(){let g=game;if(g.owned.includes(0)&&Math.random()<.55)return'weapon';return['heal','shield','power','coins'][Math.floor(Math.random()*4)]}
function shoot(){let g=game,p=g.player,w=WEAPONS[g.weapon];if(g.fireCd>0||g.mode!=='play')return;
  if(g.energy<w.cost){if(!g.emptyAt||g.time-g.emptyAt>1.3){toast(T().resourceEmpty);g.emptyAt=g.time}return}
  let pw=(1+g.power*.22)*(g.buffs.rage>0?1.6:1);for(let i=0;i<w.n;i++){let a=g.aim+(i-(w.n-1)/2)*w.spread+rand(-.02,.02)+(w.jit?rand(-w.jit,w.jit):0);
    g.bullets.push({x:p.x+Math.cos(a)*20,y:p.y+Math.sin(a)*20,vx:Math.cos(a)*w.speed,vy:Math.sin(a)*w.speed,damage:w.damage*pw,enemy:false,color:w.color,r:w.big?8:4,life:1.6,pierce:w.pierce||0,aoe:w.aoe||0,home:w.home,hit:[]})}
  g.energy-=w.cost;g.fireCd=w.rate;addParticle(p.x+Math.cos(g.aim)*22,p.y+Math.sin(g.aim)*22,w.color,2);beep(w.big?170:380+g.weapon*110,.045,'square',.023)}
function boom(b){let g=game;for(let e of [...g.enemies])if(dist(e,b)<b.aoe+e.r)enemyHit(e,b.damage*.7);for(let i=0;i<24;i++)g.particles.push({x:b.x,y:b.y,vx:Math.cos(i)*rand(60,190),vy:Math.sin(i)*rand(60,190),life:rand(.2,.45),c:'#f5c268',size:rand(3,6)});g.screenShake=4;beep(110,.2,'sawtooth',.06)}
function dash(){if(!game||game.mode!=='play')return;let p=game.player;if(p.dashCd>0){toast(T().abilityWait);return}let v=movement(),a=v.x||v.y?Math.atan2(v.y,v.x):game.aim;p.dx=Math.cos(a);p.dy=Math.sin(a);p.dash=.18;p.dashCd=5;p.inv=.35;addParticle(p.x,p.y,'#7be6df',14);beep(850,.13,'triangle',.07)}
function movement(){let x=0,y=0,k=input.keys;if(k.has('KeyA')||k.has('ArrowLeft'))x--;if(k.has('KeyD')||k.has('ArrowRight'))x++;if(k.has('KeyW')||k.has('ArrowUp'))y--;if(k.has('KeyS')||k.has('ArrowDown'))y++;if(input.joy){x+=input.joy.vx;y+=input.joy.vy}let z=Math.hypot(x,y);return z>1?{x:x/z,y:y/z}:{x,y}}

// ==================== UPDATE ====================
function update(dt){let g=game;if(!g||g.mode!=='play')return;let p=g.player,R=g.room,dn=v=>Math.max(0,v-dt);
  g.fireCd=dn(g.fireCd||0);p.inv=dn(p.inv);p.dash=dn(p.dash);p.dashCd=dn(p.dashCd);g.screenShake=Math.max(0,g.screenShake-dt*28);g.energy=clamp(g.energy+dt*6,0,g.maxEnergy);
  let m=p.dead?{x:0,y:0}:movement(),mv=p.dash>0?{x:p.dx,y:p.dy}:m,sp=p.dash>0?720:200*(g.buffs.speed>0?1.35:1);if(m.x||m.y)p.step+=dt;
  p.x=clamp(p.x+mv.x*sp*dt,bounds.l+20,bounds.r-20);p.y=clamp(p.y+mv.y*sp*dt,bounds.t+22,bounds.b-18);pushOut(p,p.r+2);
  let a=aimAt();g.aim=Math.atan2(a.y-p.y,a.x-p.x);if(Math.abs(a.x-p.x)>6)p.face=a.x>p.x?1:-1;else if(m.x)p.face=m.x>0?1:-1;
  if(input.mouse.down||input.fire||input.keys.has('KeyJ')||g.autoUntil>g.time)shoot();
  if(!R.cleared&&!g.enemies.length){g.waveWait-=dt;if(g.waveWait<=0){if(R.wave<R.waves){spawnWave();g.waveWait=.8}else roomClear()}}
  if(!p.dead&&R.cleared)for(let k in R.doors){let c=DOOR[k];if(Math.abs(p.x-c.x)<30&&Math.abs(p.y-c.y)<26){enterRoom(R.doors[k],k);return}}
  for(let e of [...g.enemies]){e.flash=dn(e.flash);e.t+=dt;if(e.spawn>0){e.spawn-=dt;continue}if(e.custom){customAI(e,dt);continue}p=nearestP(e);
    let d=dist(e,p),an=Math.atan2(p.y-e.y,p.x-e.x),mvx=0,mvy=0,spd=e.speed*g.buff;e.face=p.x>e.x?1:-1;
    if(e.type==='bug'){mvx=Math.cos(an+Math.sin(e.t*3)*.5);mvy=Math.sin(an+Math.sin(e.t*3)*.5)}
    else if(e.type==='urgent'){if(e.state===0){mvx=Math.cos(an);mvy=Math.sin(an);if(d<230&&(e.st-=dt)<=0){e.state=1;e.st=.55;e.dirx=Math.cos(an);e.diry=Math.sin(an)}}else if(e.state===1){spd=0;if((e.st-=dt)<=0){e.state=2;e.st=.5}}else{mvx=e.dirx;mvy=e.diry;spd=380;if((e.st-=dt)<=0){e.state=0;e.st=1.2}}}
    else if(e.type==='mail'){let k=d>240?1:d<160?-1:0;mvx=Math.cos(an)*k+Math.cos(an+1.57)*Math.sin(e.t)*.4;mvy=Math.sin(an)*k+Math.sin(an+1.57)*Math.sin(e.t)*.4}
    else if(e.type==='meet'){mvx=Math.cos(an);mvy=Math.sin(an)}
    else{if(e.state===1){mvx=e.dirx;mvy=e.diry;spd=400;if((e.st-=dt)<=0)e.state=0;if(e.x<bounds.l+40||e.x>bounds.r-40||e.y<bounds.t+40||e.y>bounds.b-40)e.state=0}else if(d>150){mvx=Math.cos(an);mvy=Math.sin(an)}}
    e.x=clamp(e.x+mvx*spd*dt,bounds.l+22,bounds.r-22);e.y=clamp(e.y+mvy*spd*dt,bounds.t+24,bounds.b-20);
    if(d<e.r+p.r+2)hurt(1,p);
    if(!(e.type==='bug'||e.type==='urgent')&&e.state===0){e.shoot-=dt;if(e.shoot<=0)enemyAttack(e)}
    }
  p=g.player;for(let b of [...g.bullets]){let rm=false;if(b.home){let t=g.enemies.filter(e=>e.spawn<=0).sort((u,v)=>dist(u,b)-dist(v,b))[0];if(t){let c=Math.atan2(b.vy,b.vx),w=Math.atan2(t.y-b.y,t.x-b.x),df=Math.atan2(Math.sin(w-c),Math.cos(w-c)),s=Math.hypot(b.vx,b.vy);c+=clamp(df,-5*dt,5*dt);b.vx=Math.cos(c)*s;b.vy=Math.sin(c)*s}}
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.life<=0||b.x<bounds.l||b.x>bounds.r||b.y<bounds.t||b.y>bounds.b||inCrate(b.x,b.y,b.r*.5)){rm=true;if(b.aoe)boom(b)}
    else if(b.enemy){if(Math.hypot(b.x-p.x,b.y-p.y)<b.r+p.r){rm=true;hurt(b.damage,p)}}
    else{let e=g.enemies.find(e=>e.spawn<=0&&!b.hit.includes(e)&&Math.hypot(b.x-e.x,b.y-e.y)<b.r+e.r);if(e){b.hit.push(e);if(b.aoe){boom(b);rm=true}else if(e.type==='shield'&&blocked(e,b)){rm=true;addParticle(b.x,b.y,'#cfe3f0',4);beep(900,.03,'square',.02)}else{enemyHit(e,b.damage);if(b.pierce-- <=0)rm=true}}}
    if(rm){let i=g.bullets.indexOf(b);if(i>=0)g.bullets.splice(i,1)}}
  for(let v of [...g.particles]){v.x+=v.vx*dt;v.y+=v.vy*dt;v.life-=dt;if(v.life<=0)g.particles.splice(g.particles.indexOf(v),1)}}
function nearestProp(pl){pl=pl||game.player;let R=pl.rm||game.room;if(!R||!R.cleared)return null;return R.props.filter(o=>!o.used).sort((a,b)=>dist(pl,a)-dist(pl,b))[0]}
function interact(){if(!game||game.mode!=='play')return;let o=nearestProp();if(!o||dist(game.player,o)>82)return;
  if(o.type==='portal'){if(game.stage>=2)endGame(true);else{game.stage++;startFloor();toast(`${T().room} ${game.stage}/2`)}}else if(o.type==='merchant')openShop();else askQuestion(o.type,o)}

function nextQuestion(){let g=game;if(!g.deck.length)g.deck=QUESTIONS.map((_,i)=>i).sort(()=>Math.random()-.5);return QUESTIONS[g.deck.pop()]}

function answer(index){let z=game?.question;if(!z||z.answered)return;z.answered=true;z.chosen=index;let q=z.q,good=index===q.correct,stat=game.stats[q.topic]||(game.stats[q.topic]={right:0,total:0});stat.total++;if(good)stat.right++;let buttons=[...$('answers').children];buttons.forEach((b,i)=>{b.disabled=true;if(i===q.correct)b.classList.add('good');else if(i===index)b.classList.add('bad')});let t=T(),prefix=index<0?t.timeout:good?t.correct:t.wrong;
  if(good){if(z.kind==='boss'){if(game.enemies.includes(z.target)){enemyHit(z.target,z.target.max*.22);if(game.mode==='play')game.mode='question'}game.hp=clamp(game.hp+1,0,game.maxHp)}else{z.target.used=true;let rewards=['heal','shield','power','coins'],r=rewards[Math.floor(Math.random()*rewards.length)];if(r==='heal')game.hp=clamp(game.hp+2,0,game.maxHp);if(r==='shield')game.shield=clamp(game.shield+2,0,game.maxShield);if(r==='power')game.power=clamp(game.power+1,0,6);if(r==='coins')game.coins+=12;z.reward=r}beep(750,.22,'triangle',.07)}else{if(z.kind==='boss'&&Math.random()<.5)game.buff=Math.min(1.6,game.buff+.17);else{game.hp=Math.max(0,game.hp-1);game.player.inv=.6}beep(120,.27,'sawtooth',.06)}
  $('explanation').textContent=`${prefix} ${!good?t.correctAnswer+' '+q.options[lang][q.correct]+'. ':''}${q.explain[lang]}`;$('question-continue').classList.remove('hidden');if(game.hp<=0)z.dead=true;
}
function finishQuestion(){let z=game?.question;if(!z||!z.answered)return;$('question').classList.add('hidden');game.question=null;game.mode='play';if(z.dead)endGame(false);else if(z.kind!=='boss'&&z.reward)toast(`${T().chestReward} ${({heal:T().shopHeal,shield:T().shopShield,power:T().shopPower,coins:'+12 '+T().coins})[z.reward]}`)}

function controls(){if(!touchCapable||!game||game.mode==='end')return;let j=input.joy||{x:135,y:408,tx:135,ty:408};ctx.globalAlpha=.62;ctx.fillStyle='#b3cbd0';ctx.beginPath();ctx.arc(j.x,j.y,70,0,7);ctx.fill();ctx.fillStyle='#2e5262';ctx.beginPath();ctx.arc(j.x,j.y,56,0,7);ctx.fill();ctx.fillStyle='#c9e6e9';ctx.beginPath();ctx.arc(j.tx,j.ty,23,0,7);ctx.fill();for(let b of touchButtons()){ctx.fillStyle=b.id==='fire'?'#afcbd5':'#88aab5';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();ctx.fillStyle='#314b5a';ctx.beginPath();ctx.arc(b.x,b.y,b.r-9,0,7);ctx.fill();ctx.fillStyle='#e1f4f5';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`bold ${b.id==='fire'?45:29}px system-ui`;ctx.fillText(b.id==='fire'?'◎':b.id==='swap'?'↻':b.id==='interact'?'✦':b.id==='potion'?'♥':'ϟ',b.x,b.y+1)}ctx.textBaseline='alphabetic';ctx.globalAlpha=1}
function render(){ctx.imageSmoothingEnabled=false;let d=canvas.width/W;ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#061924';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.setTransform(view.scale,0,0,view.scale,view.ox,view.oy);ctx.save();if(game?.screenShake)ctx.translate(rand(-game.screenShake,game.screenShake),rand(-game.screenShake,game.screenShake));floor();if(game){drawProps();for(let e of game.enemies)drawEnemy(e);drawPlayer(game.player);for(let b of game.bullets){ctx.globalAlpha=.18;ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(b.x,b.y,b.r*2.7,0,7);ctx.fill();ctx.globalAlpha=1;box(b.x-b.r,b.y-b.r,b.r*2,b.r*2,b.color);box(b.x-2,b.y-2,4,4,'#fff7e8')}for(let p of game.particles)box(p.x,p.y,p.size,p.size,p.c)}ctx.restore();hud();controls();if(!game){ctx.textAlign='center';ctx.font='bold 20px system-ui';ctx.fillStyle='#d6be8d';ctx.fillText('PROJECT DUNGEON',480,220)}if(!touchCapable&&game?.mode==='play'&&input.mouse.moved){let m=input.mouse;ctx.strokeStyle='#d9fcfa';ctx.lineWidth=2;ctx.beginPath();ctx.arc(m.x,m.y,9,0,7);ctx.moveTo(m.x-16,m.y);ctx.lineTo(m.x-5,m.y);ctx.moveTo(m.x+5,m.y);ctx.lineTo(m.x+16,m.y);ctx.moveTo(m.x,m.y-16);ctx.lineTo(m.x,m.y-5);ctx.moveTo(m.x,m.y+5);ctx.lineTo(m.x,m.y+16);ctx.stroke()}}
function loop(now){let dt=clamp((now-last)/1000,0,.04);last=now;clock+=dt;if(game&&['play','question','shop'].includes(game.mode)&&!document.hidden)game.time+=dt;if(game?.mode==='question'&&!game.question.answered&&!document.hidden){let z=game.question;z.remaining=Math.max(0,z.remaining-dt);$('timer-fill').style.width=(z.remaining/(z.kind==='boss'?15:22)*100)+'%';$('question-meta').textContent=`${z.kind==='boss'?T().bossQuiz:T().quiz} · ${T().topics[z.q.topic]} · ${z.q.difficulty}/3 · ${Math.ceil(z.remaining)} ${T().seconds}`;if(z.remaining<=0)answer(-1)}update(dt);render();requestAnimationFrame(loop)}

// ==================== PERSONAL INVENTORIES / NETWORK RESPAWN ====================
Object.assign(I18N.ru.x,{respawn:'Возродиться с потерей вещей',respawnInfo:'Вы потеряете своё оружие, зелья, монеты и усиления. Вещи других игроков сохранятся.',potionUse:'Зелье',potionHint:'Использовать первое зелье · H / R',personal:'У каждого игрока своё здоровье и снаряжение'});
Object.assign(I18N.kk.x,{respawn:'Заттарды жоғалтып қайта тірілу',respawnInfo:'Өз қаруыңыз, сусындарыңыз, тиындарыңыз және күшейтулеріңіз жоғалады. Басқа ойыншылардың заттары сақталады.',potionUse:'Сусын',potionHint:'Бірінші сусынды қолдану · H / R',personal:'Әр ойыншының денсаулығы мен жабдығы жеке'});
I18N.ru.x.team=I18N.ru.x.personal;I18N.kk.x.team=I18N.kk.x.personal;
I18N.ru.help+=' · H / R — использовать зелье.';I18N.kk.help+=' · H / R — сусынды қолдану.';
const personalKeys=['hp','maxHp','shield','maxShield','energy','maxEnergy','coins','owned','potions','power','buffs','weapon'];
const stateFor=p=>p===game.player?game:p;
function resetGear(target,hero){let h=HEROES[hero]||HEROES[0];Object.assign(target,{hp:h.hp,maxHp:h.hp,shield:h.sh,maxShield:Math.max(6,h.sh),energy:h.en,maxEnergy:h.en,coins:0,owned:WEAPONS.map((_,i)=>i===0?1:0),potions:[],power:h.pw,buffs:{rage:0,speed:0,ward:0},weapon:0,fireCd:0})}
function clearControls(){input.keys.clear();input.mouse.down=false;input.fire=null;input.fd=null;input.joy=null;input.aim=null;if(game)game.autoUntil=0}
function withPlayer(p,fn){if(p===game.player)return fn();let g=game,old={};for(let k of personalKeys){old[k]=g[k];g[k]=p[k]}let host=g.player;g.player=p;try{return fn()}finally{for(let k of personalKeys){p[k]=g[k];g[k]=old[k]}g.player=host}}
const startHostPersonal=netStartHost;netStartHost=function(){startHostPersonal();if(net.role!=='host'||!game)return;game.player.hero=prof.hero;game.player.life=0;game.player.dead=false;for(let a of Object.values(game.allies)){let r=net.roster.find(r=>r.id===a.id);a.hero=r?.spec?.hero||0;a.life=0;a.dead=false;a.inv=0;resetGear(a,a.hero)}clearControls()};
const collectPersonal=collect;collect=function(d,p=game.player){if(!p||p.dead)return;return withPlayer(p,()=>collectPersonal(d))};
// Uncollected coins stay in the room; leaving never transfers them to the host.
leaveRoom=function(){};
const clearRoomPersonal=roomClear;roomClear=function(){let g=game;if(g.player.dead)g.coins-=3;clearRoomPersonal();for(let a of Object.values(g.allies||{}))if(!a.dead&&a.rm===g.room)a.coins+=3};
const shootPersonal=shoot;shoot=function(){if(!game?.player.dead)return shootPersonal()};
const dashPersonal=dash;dash=function(){if(!game?.player.dead)return dashPersonal()};
const swapPersonal=changeWeapon;changeWeapon=function(n){if(!game?.player.dead)return swapPersonal(n)};
const potionPersonal=usePotion;usePotion=function(){if(!game||game.player.dead||game.mode!=='play'||!game.potions.length||['pause','settings','shop'].some(id=>!$(id).classList.contains('hidden')))return;potionPersonal();syncPotionButton()};
const interactPersonal=interact;interact=function(p){if(!game?.player.dead)return interactPersonal(p)};
function markDead(p){if(p.dead)return;p.dead=true;p.life=(p.life||0)+1;p.dash=0;p.dashT=0;p.inp=null;if(p===game.player){clearControls();['pause','shop','settings','question'].forEach(id=>show(id,false));show('end');renderEnd()}}
hurt=function(amount,p=game.player){let g=game;if(!p||p.dead||p.inv>0||g.mode!=='play')return;let st=stateFor(p);if(st.buffs.ward>0)return;let absorbed=Math.min(st.shield,amount);st.shield-=absorbed;st.hp=Math.max(0,st.hp-amount+absorbed);p.inv=.8;g.screenShake=6;pushText(p.x,p.y-26,'-'+amount,'#ff6b7a');if(st.hp<=0){if(net.inGame)markDead(p);else endGame(false)}};
const endPersonal=endGame;endGame=function(won){if(net.inGame&&!game.guest&&!won){markDead(game.player);return}endPersonal(won);clearControls()};
const endViewPersonal=renderEnd;renderEnd=function(){endViewPersonal();let g=game,b=$('again');b.disabled=false;if(net.inGame&&!g.won){b.textContent=T().x.respawn;$('end-summary').textContent+=' · '+T().x.respawnInfo}else if(net.inGame&&net.role==='guest'){b.textContent=T().x.guestL;b.disabled=true}};
function respawnPlayer(p,life){let g=game;if(net.role!=='host'||!net.inGame||g.won||!p.dead||life!==p.life)return;resetGear(stateFor(p),p.hero);p.dead=false;p.inv=3;p.dash=0;p.dashT=0;p.dashCd=0;p.doorCd=.8;p.inp=null;p.rm=g.room;let i=p===g.player?0:Object.keys(g.allies).indexOf(String(p.id))+1,pos=arrivePos(null,i);p.x=pos[0];p.y=pos[1];pushOut(p,p.r+2);if(p===g.player){g.mode='play';g.endShown=0;show('end',false);clearControls()}net.st=0;netSend(snap(g))}
$('again').onclick=()=>{if(!game)return;if(!net.inGame){newGame();return}if(game.won){if(net.role==='host')netStartHost();return}if(net.role==='guest')netSend({t:'act',a:'respawn',life:game.player.life});else respawnPlayer(game.player,game.player.life)};
allyShoot=function(a){let g=game,w=WEAPONS[a.weapon];if(a.dead||a.energy<w.cost)return;let pw=(1+a.power*.22)*(a.buffs.rage>0?1.6:1);for(let i=0;i<w.n;i++){let an=a.aim+(i-(w.n-1)/2)*w.spread+rand(-.02,.02)+(w.jit?rand(-w.jit,w.jit):0);g.bullets.push({x:a.x+Math.cos(an)*20,y:a.y+Math.sin(an)*20,vx:Math.cos(an)*w.speed,vy:Math.sin(an)*w.speed,damage:w.damage*pw,enemy:false,color:w.color,r:w.big?8:4,life:1.6,pierce:w.pierce||0,aoe:w.aoe||0,home:w.home,hit:[]})}a.energy-=w.cost;a.fireCd=w.rate};
const allyActionPersonal=allyAct;allyAct=function(a,m){if(m.a==='respawn'){respawnPlayer(a,m.life);return}if(a.dead||game.mode!=='play')return;if(m.a==='potion'){withPlayer(a,()=>_up());return}if(m.a==='swap'){for(let i=1;i<=WEAPONS.length;i++){let k=(a.weapon+i)%WEAPONS.length;if(a.owned[k]){a.weapon=k;break}}return}if(m.a==='interact'){let o=nearestProp(a);if(o&&dist(a,o)<82&&o.type==='altar'){withPlayer(a,()=>_int(a));return}}allyActionPersonal(a,m)};
const snapPersonal=snap;snap=function(g){let m=snapPersonal(g);m.personal={};for(let p of [g.player,...Object.values(g.allies||{})]){let st=stateFor(p),s={dead:!!p.dead,life:p.life||0,inv:p.inv||0};for(let k of personalKeys)s[k]=st[k];m.personal[p.id]=s}return m};
const applyPersonal=applySnap;applySnap=function(m){applyPersonal(m);let g=game;if(!g?.guest)return;let me=m.personal?.[net.id];if(!me)return;for(let k of personalKeys)g[k]=me[k];Object.assign(g.player,{dead:me.dead,life:me.life,inv:me.inv});for(let a of Object.values(g.allies)){let st=m.personal[a.id];if(st)Object.assign(a,{...st})}if(!g.won){if(me.dead){g.mode='end';g.endShown=1;show('pause',false);show('shop',false);show('settings',false);show('end');renderEnd();clearControls()}else{g.endShown=0;show('end',false)}}syncPotionButton()};
const drawPersonal=drawPlayer;drawPlayer=function(p,pl){if(p.dead)return;drawPersonal(p,pl)};
const updatePersonal=update;update=function(dt){if(game&&!game.guest&&net.inGame&&game.player.dead&&!Object.values(game.allies||{}).some(a=>!a.dead)){net.st+=dt;if(net.st>=1/15){net.st=0;netSend(snap(game))}return}updatePersonal(dt)};
function syncPotionButton(){let b=$('potion-button'),g=game,visible=!!g&&!g.player.dead&&g.mode==='play'&&['pause','settings','shop','end'].every(id=>$(id).classList.contains('hidden'));b.classList.toggle('hidden',!visible);b.disabled=!g?.potions.length;let label=T().x.potionUse+' · H ('+(g?.potions.length||0)+')';if(b.textContent!==label)b.textContent=label;b.title=T().x.potionHint;b.setAttribute('aria-label',T().x.potionHint)}
$('potion-button').onclick=e=>{e.stopPropagation();wakeAudio();usePotion()};
const renderPersonal=render;render=function(){renderPersonal();syncPotionButton();if(net.inGame)show('restart',false);else show('restart',true)};

// Each player's merchant purchases use only their own coins and inventory.
const interactShopPersonal=interact;interact=function(p){let who=p?.r?p:game?.player;if(game&&!game.guest&&who&&!who.dead){let o=nearestProp(who);if(o?.type==='chest'&&dist(who,o)<82)o.opener=who.id}return interactShopPersonal(p)};
const lootPersonal=lootChest;lootChest=function(o){let p=o.opener===game.player.id?game.player:game.allies?.[o.opener];if(p)return withPlayer(p,()=>lootPersonal(o));return lootPersonal(o)};
const shopAllyAction=allyAct;allyAct=function(a,m){if(!a.dead&&game.mode==='play'){
  if(m.a==='closeShop'){a.shopRoom=null;return}
  if(m.a==='interact'){let o=nearestProp(a);if(o&&dist(a,o)<82){if(o.type==='chest')o.opener=a.id;if(o.type==='merchant'){a.shopRoom=a.rm;a.shops=a.shops||new Map();if(!a.shops.has(a.rm))a.shops.set(a.rm,stockGen({...a,stage:game.stage}));return}}}
  if(m.a==='buy'){let merchant=a.shopRoom?.props.find(o=>o.type==='merchant'),stock=a.shops?.get(a.shopRoom),s=Number.isInteger(m.index)&&stock?.[m.index];if(a.shopRoom!==a.rm||!merchant||dist(a,merchant)>100||!s||s.sold||a.coins<s.p||(s.k==='p'&&a.potions.length>=3))return;a.coins-=s.p;s.sold=1;if(s.k==='w'){a.owned[s.i]=1;a.weapon=s.i}else if(s.k==='p')a.potions.push(s.id);else if(s.id==='power')a.power++;else if(s.id==='hp'){a.maxHp++;a.hp++}else{a.maxEnergy+=40;a.energy+=40}return}
}shopAllyAction(a,m)};
const snapShopPersonal=snap;snap=function(g){let m=snapShopPersonal(g);for(let a of Object.values(g.allies||{}))m.personal[a.id].shop=!a.dead&&a.shopRoom===a.rm?a.shops?.get(a.shopRoom)||null:null;return m};
function renderGuestShop(stock){let g=game,t=T(),x=t.x;$('shop-title').textContent=x.merchant;$('shop-info').textContent=`◈ ${g.coins} · ${x.potions}: ${g.potions.length}/3`;$('shop-next').textContent=x.leave;$('reroll').classList.add('hidden');let el=$('shop-items');el.replaceChildren();el.className='cards';stock.forEach((s,index)=>{let b=document.createElement('button');b.className='card';b.disabled=s.sold||g.coins<s.p||(s.k==='p'&&g.potions.length>=3);b.append(iconEl(s.k,s.id),document.createTextNode(s.k==='w'?t.weapons[WEAPONS[s.i].id]:s.k==='p'?t.pot[s.id]:t.upg[s.id]),document.createElement('br'),document.createTextNode(s.sold?t.sold:`${s.p} ◈`));b.onclick=()=>netSend({t:'act',a:'buy',index});el.append(b)})}
const snapApplyShop=applySnap;applySnap=function(m){snapApplyShop(m);if(!game?.guest)return;let stock=m.personal?.[net.id]?.shop;if(stock&&!game.player.dead&&!game.won){show('shop');let key=JSON.stringify([stock,game.coins,game.potions]);if(game.shopKey!==key){game.shopKey=key;renderGuestShop(stock)}}else{game.shopKey=null;show('shop',false)}};
const closeShopPersonal=nextStage;nextStage=function(){if(game?.guest){netSend({t:'act',a:'closeShop'});show('shop',false);return}closeShopPersonal()};$('shop-next').onclick=()=>nextStage();
const renderShopPersonal=renderShop;renderShop=function(){$('reroll').classList.remove('hidden');return renderShopPersonal()};
const respawnShopPersonal=respawnPlayer;respawnPlayer=function(p,life){if(p.dead&&p.life===life){p.shopRoom=null;p.shops=null}respawnShopPersonal(p,life)};
const movementPersonal=movement;movement=function(){if(game?.player.dead||['pause','shop','settings','end'].some(id=>!$(id).classList.contains('hidden')))return{x:0,y:0};return movementPersonal()};
const shootOverlayPersonal=shoot;shoot=function(){if(['pause','shop','settings','end'].some(id=>!$(id).classList.contains('hidden')))return;shootOverlayPersonal()};
const guestInputPersonal=guestUpdate;guestUpdate=function(dt){if(['pause','shop','settings','end'].some(id=>!$(id).classList.contains('hidden')))clearControls();guestInputPersonal(dt)};

resize();$('sound').textContent=soundOn?'♪':'×';localize();requestAnimationFrame(loop);
